[platformio]
default_envs = wt32_s1_eth01

[env:wt32_s1_eth01]
; pioarduino arduino-esp32 3.x + ESP-IDF 5.x (proper BT/BLE chain)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA-capable partition layout (app0 + app1 + spiffs)
; Replaces huge_app.csv which had no OTA slots
board_build.partitions = min_spiffs.csv

build_flags =
  -DFW_VERSION=\"1.5.1\"
  -DBLAST_BLE_PROV=1
  ; Transition period: also accept legacy UDP nodes (set to 0 once all nodes run ESP-NOW)
  -DBLAST_TRANSPORT_UDP=1
  ; -DEXTERNAL_ANTENNA   ; lowers ESP-NOW TX power to 17 dBm
  ; FW_BUILD comes from __DATE__ __TIME__ baked at compile time (see main.cpp)

; Use the vendored firmware/lib/WiFiProv (matches arduino-esp32 3.x /
; ESP-IDF 5.x with network_provisioning API).
lib_extra_dirs = ../lib

; No external lib_deps — uses only built-in Arduino ESP32 libraries
; Update.h (OTA) is part of ESP32 core, no extra dep needed

; ESP-NOW only — use once every node runs v1.5.0 (drops legacy UDP node handlers)
[env:wt32_espnow_only]
extends = env:wt32_s1_eth01
build_flags =
  -DFW_VERSION=\"1.5.1\"
  -DBLAST_BLE_PROV=1
  -DBLAST_TRANSPORT_UDP=0

; NOTE: Do NOT use erase_flash.py in normal builds — it destroys NVS (WiFi creds, node names).
; Use only for factory reset: pio run -e factory_reset -t upload
; extra_scripts = pre:erase_flash.py

; EXPERIMENT: NimBLE instead of Bluedroid so BLE provisioning can stay on
; together with ESP-NOW + ETH + AP (Bluedroid ran the heap out: abort at boot).
; custom_sdkconfig = pioarduino hybrid compile of the Arduino libs.
[env:wt32_nimble]
extends = env:wt32_s1_eth01
custom_sdkconfig =
  CONFIG_BT_ENABLED=y
  CONFIG_BT_BLUEDROID_ENABLED=n
  CONFIG_BT_NIMBLE_ENABLED=y
  CONFIG_BT_CONTROLLER_ENABLED=y
  CONFIG_BTDM_CTRL_MODE_BLE_ONLY=y
  CONFIG_BTDM_CTRL_MODE_BTDM=n
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
; hybrid compile builds every managed component; esp-modbus fails its own
; static_assert with the default Kconfig and the hub does not use it
custom_component_remove =
  espressif/esp-modbus
; hybrid build drops the BT controller include dir, so __has_include("esp_bt.h")
; is false and WiFiProv compiles without its BLE scheme — add it back
build_flags =
  ${env:wt32_s1_eth01.build_flags}
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32/include/bt/include/esp32/include
; Arduino BLE helper libs that only build against Bluedroid; the hub does not use them
lib_ignore =
  SimpleBLE
  BluetoothSerial

; TEST: only starts a WiFi AP "BLASTGATE_TEST" (test_ap/main.cpp), nothing else.
; test_ap         = stock Arduino libs (Bluedroid)
; test_ap_nimble  = same hybrid/NimBLE libs as wt32_nimble
[env:test_ap]
extends = env:wt32_s1_eth01
build_src_filter = -<*> +<../test_ap/main.cpp>
lib_ignore = WiFiProv

[env:test_ap_nimble]
extends = env:wt32_nimble
build_src_filter = -<*> +<../test_ap/main.cpp>
lib_ignore =
  SimpleBLE
  BluetoothSerial
  WiFiProv

; Same bare AP test, built with the platform/board of the working DMX-ArtNet
; converter (Arduino core 2.x / IDF 4.4) to compare against core 3.x.
[env:test_ap_core2]
platform = espressif32@6.9.0
board = wt32-eth01
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<../test_ap/main.cpp>
lib_ignore = WiFiProv, blastgate_proto
board_build.partitions = min_spiffs.csv
